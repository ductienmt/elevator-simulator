version: '3.8'

services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: elevator-backend
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
    restart: unless-stopped
    networks:
      - elevator-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:9000}
    container_name: elevator-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:9000}
    restart: unless-stopped
    networks:
      - elevator-network

networks:
  elevator-network:
    driver: bridge
