version: '3.8'

services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: elevator-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped
    networks:
      - elevator-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: elevator-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - elevator-network

networks:
  elevator-network:
    driver: bridge
